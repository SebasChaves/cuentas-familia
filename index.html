<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0E1013" />
    <meta name="description" content="Lo que nos debemos entre todos, sin enredos." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cuentas·Fam" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" />
    <title>Cuentas en Familia</title>
    <style>
      /* Pantalla de carga: va aquí para que se vea antes de que cargue la app */
      html, body { margin: 0; background: #0e1013; }
      .splash { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: #0e1013; color: #f3f4f6; font-family: 'Space Grotesk', system-ui, sans-serif; transition: opacity .35s ease; }
      .splash.out { opacity: 0; pointer-events: none; }
      .splash svg { width: 132px; height: 110px; overflow: visible; }
      .splash .seesaw { transform-box: view-box; transform-origin: 60px 74px; animation: seesaw 1.6s ease-in-out infinite alternate; }
      .splash .ball-a { transform-box: fill-box; transform-origin: center bottom; animation: hop 1.6s ease-in-out infinite; }
      .splash .ball-b { transform-box: fill-box; transform-origin: center bottom; animation: hop 1.6s ease-in-out .8s infinite; }
      .splash-name { font-size: 22px; font-weight: 700; letter-spacing: .5px; }
      .splash-sub { font-family: Inter, system-ui, sans-serif; font-size: 14px; color: #9ca3af; animation: breathe 1.6s ease-in-out infinite; }
      @keyframes seesaw { from { transform: rotate(-10deg); } to { transform: rotate(10deg); } }
      @keyframes hop { 0%, 100% { transform: translateY(0) scale(1, 1); } 45% { transform: translateY(-10px) scale(.96, 1.04); } 55% { transform: translateY(-10px); } 90% { transform: translateY(0) scale(1.06, .94); } }
      @keyframes breathe { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .splash * { animation: none !important; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash" role="status" aria-label="Cargando">
        <svg viewBox="0 0 120 100" aria-hidden="true">
          <path d="M60 76 L50 94 H70 Z" fill="#3a4048" />
          <g class="seesaw">
            <rect x="10" y="70" width="100" height="8" rx="4" fill="#f3f4f6" />
            <circle class="ball-a" cx="30" cy="53" r="17" fill="#2dd4bf" />
            <circle class="ball-b" cx="90" cy="53" r="17" fill="#fb923c" />
          </g>
        </svg>
        <div class="splash-name">CUENTAS·FAM</div>
        <div class="splash-sub">Sacando las cuentas…</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
